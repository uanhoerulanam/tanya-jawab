<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ankraixmotion | Ruang Dengar</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- OneSignal SDK v16 -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "69f136f5-580e-49db-8573-83fbbd2099d1",
        allowLocalhostAsSecureOrigin: true,
        notifyButton: { enable: false }, 
      });
    });
  </script>

  <style>
    body {
      background-color: #0b0c10;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 45%);
    }
    .glow-box { box-shadow: 0 0 25px rgba(139, 92, 246, 0.2); }
    .glow-text { text-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }
  </style>
</head>
<body class="text-gray-200 min-h-screen p-4 flex flex-col justify-between">

  <div class="max-w-xl mx-auto w-full my-6">
    
    <div class="text-center mb-8 relative">
      <div class="flex flex-col items-center mb-2">
        <button id="btnToggleAdmin" class="text-xs bg-gray-800/80 hover:bg-gray-700 text-purple-400 px-3 py-1.5 rounded-full border border-purple-500/30 transition-all mb-2">
          🔒 Mode Admin
        </button>
        
        <!-- Kotak ID Admin -->
        <div id="adminIdBox" class="hidden text-xs text-green-400 bg-gray-900 p-2 rounded border border-green-900/50 flex items-center gap-2">
          <span>ID HP: <span id="adminPlayerId" class="font-bold select-all text-white">Mencari ID...</span></span>
          <button onclick="copyAdminId()" class="bg-green-700 px-2 py-1 rounded hover:bg-green-600">Copy</button>
        </div>
      </div>

      <div class="relative inline-block mt-4">
        <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl blur opacity-75 animate-pulse"></div>
        <img id="logoImg" src="logo.png" alt="ankraixmotion" 
             class="relative w-24 h-24 object-cover rounded-2xl border-2 border-purple-400 mx-auto bg-gray-900 shadow-2xl"
             onerror="this.onerror=null; this.src='https://api.iconify.design/lucide:crown.svg?color=%23a855f7';" />
      </div>

      <h1 class="text-3xl font-extrabold tracking-wider mt-4 bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-500 bg-clip-text text-transparent glow-text uppercase">
        ankraixmotion
      </h1>
      <p class="text-purple-300 text-sm font-medium mt-1">Ruang Dengar & Tempat Request</p>
    </div>

    <!-- Container Form -->
    <div class="bg-gray-900/90 border border-purple-500/30 rounded-2xl p-6 backdrop-blur-md glow-box mb-8">
      <form id="pesanForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-blue-400 uppercase tracking-wider mb-1">Nama / Inisial</label>
          <input type="text" id="namaInput" 
                 class="w-full bg-gray-950/80 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all placeholder-gray-600" 
                 placeholder="Masukkan nama kamu (atau Biarkan Anonim)">
        </div>

        <div>
          <label class="block text-xs font-semibold text-purple-400 uppercase tracking-wider mb-1">Pesan / Masalah / Request</label>
          <textarea id="pesanInput" rows="3" required
                    class="w-full bg-gray-950/80 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all placeholder-gray-600" 
                    placeholder="Tuliskan cerita, keluhan, atau request kamu di sini..."></textarea>
        </div>

        <button type="submit" id="btnKirim" 
                class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all transform active:scale-95 text-sm uppercase tracking-wider">
          🚀 Kirim Pesan
        </button>
      </form>
    </div>

    <!-- Feed Pesan Masuk -->
    <div class="space-y-4">
      <div class="flex items-center justify-between border-b border-gray-800 pb-2">
        <h2 class="text-base font-bold text-gray-200 flex items-center gap-2">
          <span>💬</span> Pesan & Diskusi
        </h2>
        <span id="adminStatus" class="text-xs text-gray-500 hidden">Mode Admin Aktif</span>
      </div>

      <div id="daftarPesan" class="space-y-3">
        <p class="text-gray-500 text-center text-sm py-4">Memuat pesan...</p>
      </div>
    </div>

  </div>

  <footer class="text-center text-xs text-gray-600 py-4">
    &copy; ankraixmotion — All Rights Reserved.
  </footer>

  <!-- Firebase JavaScript SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDuG7LPdnsSkMYhyQ4aRJIPGtN3WVtPWDk",
      authDomain: "ankraixmotionruangdengar.firebaseapp.com",
      projectId: "ankraixmotionruangdengar",
      storageBucket: "ankraixmotionruangdengar.firebasestorage.app",
      messagingSenderId: "53196319603",
      appId: "1:53196319603:web:47f5f1c8921cb015bfb306",
      measurementId: "G-MNJYKTS7MY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let isAdmin = false;
    const ADMIN_PIN = "1234";
    
    // ID ADMIN SUDAH DIMASUKKAN
    let ADMIN_ONESIGNAL_ID = "a2ad4780-ff97-40fd-8661-b1a1bba079fb"; 

    const form = document.getElementById('pesanForm');
    const namaInput = document.getElementById('namaInput');
    const pesanInput = document.getElementById('pesanInput');
    const daftarPesan = document.getElementById('daftarPesan');
    const btnToggleAdmin = document.getElementById('btnToggleAdmin');
    const adminStatus = document.getElementById('adminStatus');
    const adminIdBox = document.getElementById('adminIdBox');
    const adminPlayerIdSpan = document.getElementById('adminPlayerId');

    let myPlayerId = null;
    let oneSignalInstance = null;

    window.mintaIzinNotif = async function() {
      if (oneSignalInstance) {
        await oneSignalInstance.Notifications.requestPermission();
        cekIdBerkala();
      }
    }

    function cekIdBerkala() {
      let attempts = 0;
      const interval = setInterval(() => {
        if (oneSignalInstance && oneSignalInstance.User.PushSubscription.id) {
          myPlayerId = oneSignalInstance.User.PushSubscription.id;
          updateAdminIdUI();
          clearInterval(interval);
        }
        attempts++;
        if (attempts > 15) clearInterval(interval);
      }, 1000);
    }

    function updateAdminIdUI() {
      if (isAdmin && adminPlayerIdSpan) {
        if (myPlayerId) {
          adminPlayerIdSpan.innerText = myPlayerId;
          adminPlayerIdSpan.classList.remove('text-gray-400');
          adminPlayerIdSpan.classList.add('text-green-400');
        } else {
          adminPlayerIdSpan.innerText = "Klik 'Allow' Notif";
        }
      }
    }

    window.OneSignalDeferred.push(async function(OneSignal) {
      oneSignalInstance = OneSignal;
      await OneSignal.init({ appId: "69f136f5-580e-49db-8573-83fbbd2099d1" });
      cekIdBerkala();
      OneSignal.User.PushSubscription.addEventListener("change", (event) => {
        myPlayerId = event.current.id;
        updateAdminIdUI();
      });
    });

    window.copyAdminId = function() {
      if(myPlayerId) {
        navigator.clipboard.writeText(myPlayerId);
        alert("ID berhasil di-copy!");
      } else {
        alert("ID belum didapat. Pastikan Anda sudah klik Allow.");
      }
    }

    btnToggleAdmin.addEventListener('click', async () => {
      if (!isAdmin) {
        const pin = prompt("Masukkan PIN Admin:");
        if (pin === ADMIN_PIN) {
          isAdmin = true;
          btnToggleAdmin.innerText = "🔓 Keluar Mode Admin";
          btnToggleAdmin.className = "text-xs bg-purple-600 text-white px-3 py-1.5 rounded-full shadow-lg mb-2";
          adminStatus.classList.remove('hidden');
          adminIdBox.classList.remove('hidden');
          updateAdminIdUI();
          renderFeed(); 
        } else if (pin !== null) {
          alert("PIN Salah!");
        }
      } else {
        isAdmin = false;
        btnToggleAdmin.innerText = "🔒 Mode Admin";
        btnToggleAdmin.className = "text-xs bg-gray-800/80 hover:bg-gray-700 text-purple-400 px-3 py-1.5 rounded-full border border-purple-500/30 transition-all mb-2";
        adminStatus.classList.add('hidden');
        adminIdBox.classList.add('hidden');
        renderFeed();
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (!myPlayerId) {
        await mintaIzinNotif();
        alert("Sistem meminta izin notifikasi. Jika sudah klik 'Allow', tunggu 3 detik lalu klik Kirim lagi.");
        return;
      }

      const nama = namaInput.value.trim() || "Anonim";
      const pesan = pesanInput.value.trim();
      if (!pesan) return;

      const btn = document.getElementById('btnKirim');
      btn.innerText = "Mengirim...";
      btn.disabled = true;

      try {
        await addDoc(collection(db, "pesan_masuk"), {
          nama: nama,
          pesan: pesan,
          playerId: myPlayerId, 
          balasan: "",
          createdAt: serverTimestamp()
        });

        await fetch("/api/send-notif", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            judul: "📩 Pesan Baru!", 
            isi: `${nama}: ${pesan}`,
            targetId: ADMIN_ONESIGNAL_ID 
          })
        });

        pesanInput.value = '';
        alert("Pesan terkirim!");
      } catch (err) {
        alert("Gagal mengirim pesan.");
      } finally {
        btn.innerText = "🚀 Kirim Pesan";
        btn.disabled = false;
      }
    });

    let currentSnapshot = null;
    const q = query(collection(db, "pesan_masuk"), orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      currentSnapshot = snapshot;
      renderFeed();
    });

    function renderFeed() {
      if (!currentSnapshot) return;
      daftarPesan.innerHTML = '';

      if (currentSnapshot.empty) {
        daftarPesan.innerHTML = '<p class="text-gray-500 text-center text-sm py-4">Belum ada pesan yang masuk.</p>';
        return;
      }

      currentSnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;
        const isMyMessage = data.playerId === myPlayerId;
        
        const card = document.createElement('div');
        card.className = `bg-gray-900/60 border ${isMyMessage ? 'border-blue-500/50' : 'border-gray-800/80'} rounded-xl p-4 transition-all hover:border-purple-500/40`;
        
        let html = `
          <div class="flex justify-between items-start mb-2">
            <span class="font-bold text-sm bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
              ${escapeHtml(data.nama)} ${isMyMessage ? '(Anda)' : ''}
            </span>
          </div>
          <p class="text-gray-300 text-sm whitespace-pre-line leading-relaxed">${escapeHtml(data.pesan)}</p>
        `;

        if (data.balasan) {
          html += `
            <div class="mt-3 pt-3 border-t border-purple-500/20 bg-purple-950/20 -mx-4 -mb-4 p-3 rounded-b-xl">
              <div class="flex items-center gap-1.5 text-xs font-semibold text-purple-400 mb-1">
                <span>👑</span> Balasan Admin:
              </div>
              <p class="text-purple-200 text-sm whitespace-pre-line">${escapeHtml(data.balasan)}</p>
            </div>
          `;
        }

        // TOMBOL BALAS MUNCUL KARENA MODE ADMIN
        if (isAdmin) {
          const safeBalasan = encodeURIComponent(data.balasan || '');
          const safeNama = encodeURIComponent(data.nama);
          const safePesan = encodeURIComponent(data.pesan);
          const safeIdPenerima = data.playerId || '';

          html += `
            <div class="mt-3 pt-2 border-t border-gray-800 flex justify-end gap-2 text-xs">
              <button onclick="balasPesan('${id}', '${safeBalasan}', '${safeNama}', '${safeIdPenerima}', '${safePesan}')" class="bg-blue-600/80 hover:bg-blue-600 text-white px-2.5 py-1 rounded-md">
                ${data.balasan ? 'Edit Balasan' : '💬 Balas'}
              </button>
              <button onclick="hapusPesan('${id}')" class="bg-red-600/80 hover:bg-red-600 text-white px-2.5 py-1 rounded-md">
                🗑️ Hapus
              </button>
            </div>
          `;
        }

        card.innerHTML = html;
        daftarPesan.appendChild(card);
      });
    }

    // FUNGSI BALAS YANG SUDAH TIDAK AKAN ERROR LAGI
    window.balasPesan = async (id, safeBalasan, safeNama, idPenerima, safePesan) => {
      const balasanLama = decodeURIComponent(safeBalasan);
      const namaPengirim = decodeURIComponent(safeNama);
      const pesanAsli = decodeURIComponent(safePesan);

      const balasanBaru = prompt("Masukkan jawaban/balasan kamu:", balasanLama);
      
      if (balasanBaru !== null && balasanBaru.trim() !== "") {
        try {
          // 1. Simpan ke database terlebih dahulu
          await updateDoc(doc(db, "pesan_masuk", id), {
            balasan: balasanBaru.trim()
          });
          
          // 2. Kirim Notifikasi (Jika gagal, jangan munculkan error "Gagal Simpan")
          try {
            if (idPenerima && idPenerima !== "undefined" && idPenerima !== "") {
              await fetch("/api/send-notif", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  judul: "👑 Admin Membalas Pesanmu!",
                  isi: balasanBaru.trim(),
                  targetId: idPenerima 
                })
              });
            }
          } catch (notifError) {
            console.error("Notif gagal terkirim, tapi data tersimpan:", notifError);
          }

          alert("Balasan berhasil disimpan!");
          
        } catch (err) {
          console.error("Eror Database Firebase:", err);
          alert("Gagal menyimpan balasan ke database. Cek aturan Firebase.");
        }
      }
    };

    window.hapusPesan = async (id) => {
      if (confirm("Yakin ingin menghapus pesan ini?")) {
        try { await deleteDoc(doc(db, "pesan_masuk", id)); } catch (err) { alert("Gagal menghapus."); }
      }
    };

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
  </script>
</body>
</html>
